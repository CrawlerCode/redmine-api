paths:
  /attachments/download/{id}:
    get:
      operationId: Attachments_downloadAttachment
      description: Download the content of an attachment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The request has succeeded.
          content:
            "*/*":
              schema:
                contentMediaType: "*/*"
        "401":
          description: "Authentication required: the API key is missing or invalid, or the REST API is disabled"
        "403":
          description: The authenticated user is not allowed to perform this action (e.g. missing permission, or an archived project)
        "404":
          description: Resource not found
      tags:
        - Attachments
  /attachments/thumbnail/{id}:
    get:
      operationId: Attachments_getAttachmentThumbnail
      description: |-
        Get the thumbnail of an image (or PDF) attachment, in the size of the thumbnails setting.
        Not found for attachments without thumbnail.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The request has succeeded.
          content:
            "*/*":
              schema:
                contentMediaType: "*/*"
        "401":
          description: "Authentication required: the API key is missing or invalid, or the REST API is disabled"
        "403":
          description: The authenticated user is not allowed to perform this action (e.g. missing permission, or an archived project)
        "404":
          description: Resource not found
      tags:
        - Attachments
  /attachments/thumbnail/{id}/{size}:
    get:
      operationId: Attachments_getAttachmentThumbnailWithSize
      description: Get the thumbnail of an image (or PDF) attachment in the given size. Not found for attachments without thumbnail.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: size
          in: path
          required: true
          description: Thumbnail size in pixels
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The request has succeeded.
          content:
            "*/*":
              schema:
                contentMediaType: "*/*"
        "401":
          description: "Authentication required: the API key is missing or invalid, or the REST API is disabled"
        "403":
