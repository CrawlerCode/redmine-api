        - $ref: "#/components/parameters/Issues.Queries.GetIssuesQuery.include"
        - $ref: "#/components/parameters/Issues.Queries.GetIssuesQuery.issue_id"
        - $ref: "#/components/parameters/Issues.Queries.GetIssuesQuery.project_id"
        - $ref: "#/components/parameters/Issues.Queries.GetIssuesQuery.subproject_id"
        - $ref: "#/components/parameters/Issues.Queries.GetIssuesQuery.tracker_id"
