        "401":
          description: "Authentication required: the API key is missing or invalid, or the REST API is disabled"
        "403":
          description: The authenticated user is not allowed to perform this action (e.g. missing permission, or an archived project)
        "404":
          description: Resource not found
      tags:
        - Attachments
    patch:
      operationId: Attachments_updateAttachment
      description: Update an attachment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Success without content. Redmine < 4.1 responds with 200 instead of 204.
        "204":
          description: Success without content. Redmine < 4.1 responds with 200 instead of 204.
        "401":
          description: "Authentication required: the API key is missing or invalid, or the REST API is disabled"
        "403":
          description: The authenticated user is not allowed to perform this action (e.g. missing permission, or an archived project)
        "404":
          description: Resource not found
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors.UnprocessableEntityResponse"
      tags:
        - Attachments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Attachments.DTOs.UpdateAttachmentDto"
    delete:
      operationId: Attachments_deleteAttachment
      description: Delete an attachment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Success without content. Redmine < 4.1 responds with 200 instead of 204.
        "204":
