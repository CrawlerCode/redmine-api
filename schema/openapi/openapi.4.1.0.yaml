  schemas:
    Attachments.Attachment:
      type: object
      required:
        - id
        - filename
        - filesize
        - content_type
        - description
        - content_url
        - author
        - created_on
      properties:
        id:
          type: integer
          format: int64
          description: Attachment ID
          readOnly: true
        filename:
          type: string
          description: File name
        filesize:
          type: integer
          format: int64
          description: File size in bytes
          readOnly: true
        content_type:
          anyOf:
            - type: string
            - type: "null"
          description: Content type
          readOnly: true
        description:
          anyOf:
            - type: string
            - type: "null"
          description: Attachment description
        content_url:
          type: string
          format: uri
          description: URL to download the attachment
          readOnly: true
        thumbnail_url:
          type: string
          format: uri
          description: URL of the thumbnail (only for thumbnailable files)
          readOnly: true
        author:
          $ref: "#/components/schemas/Reference"
          description: Author reference
          readOnly: true
        created_on:
          type: string
          format: date-time
          description: Attachment creation date
          readOnly: true
      description: Attachment
    Attachments.DTOs.AttachmentDto:
      type: object
      required:
        - attachment
      properties:
        attachment:
          $ref: "#/components/schemas/Attachments.Attachment"
    Attachments.DTOs.UpdateAttachmentDto:
      type: object
      required:
        - attachment
      properties:
        attachment:
          $ref: "#/components/schemas/Attachments.UpdateAttachment"
    Attachments.DTOs.UploadedFileDto:
      type: object
      required:
        - upload
      properties:
        upload:
          $ref: "#/components/schemas/Attachments.UploadedFile"
    Attachments.UpdateAttachment:
      type: object
      properties:
        filename:
          type: string
          description: File name
        description:
          anyOf:
            - type: string
            - type: "null"
          description: Attachment description
      description: Attachment update payload. All properties are optional.
    Attachments.Upload:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Token returned by the upload request
        filename:
          type: string
          description: File name
        description:
          type: string
          description: Attachment description
        content_type:
          type: string
          description: Content type. Unreleased Redmine versions (after 7.0) ignore it and detect it from the file contents.
      description: Uploaded file to attach to an object (e.g. `uploads` of an issue)
    Attachments.UploadedFile:
      type: object
      required:
        - token
      properties:
        id:
          type: integer
          format: int64
          description: ID of the (not yet attached) attachment
        token:
          type: string
          description: Token to attach the file to an object
      description: Result of uploading a file via `POST /uploads.json`
    CreateCustomFieldValue:
      type: object
      required:
        - id
        - value
      properties:
        id:
          type: integer
          format: int64
          description: Custom field ID
        value:
          anyOf:
            - type: string
            - type: array
              items:
                type: string
            - type: "null"
          description: Custom field value. An array of values for custom fields accepting multiple values.
      description: Custom field value of an object
    CustomFieldValue:
      type: object
      required:
        - id
        - name
        - value
      properties:
        id:
          type: integer
          format: int64
          description: Custom field ID
        name:
          type: string
          description: Custom field name
          readOnly: true
        multiple:
          type: boolean
          description: Whether the custom field accepts multiple values
          readOnly: true
        value:
          anyOf:
            - type: string
            - type: array
              items:
                type: string
            - type: "null"
          description: Custom field value. An array of values for custom fields accepting multiple values.
      description: Custom field value of an object
    CustomFields.CustomField:
      type: object
      required:
        - id
        - name
        - customized_type
        - field_format
        - regexp
        - min_length
        - max_length
        - is_required
        - is_filter
        - searchable
        - multiple
        - default_value
        - visible
      properties:
        id:
          type: integer
          format: int64
          description: Custom field ID
        name:
          type: string
          description: Custom field name
        customized_type:
          type: string
          description: Type of the objects the custom field is for, e.g. `issue`, `project`, `time_entry`, `user`
        field_format:
          type: string
          description: Field format, e.g. `string`, `text`, `int`, `float`, `date`, `bool`, `list`, `user`, `version`, `link`
        regexp:
          anyOf:
            - type: string
            - type: "null"
          description: Regular expression the value must match
        min_length:
          anyOf:
            - type: integer
              format: int64
            - type: "null"
          description: Minimum length of the value
        max_length:
          anyOf:
            - type: integer
              format: int64
            - type: "null"
          description: Maximum length of the value
        is_required:
          type: boolean
          description: Whether a value is required
        is_filter:
          type: boolean
          description: Whether the custom field can be used as a filter
        searchable:
          anyOf:
            - type: boolean
            - type: "null"
          description: Whether the custom field is searchable
        multiple:
          type: boolean
          description: Whether the custom field accepts multiple values
        default_value:
          anyOf:
            - type: string
            - type: "null"
          description: Default value
        visible:
          type: boolean
          description: Whether the custom field is visible to all users
        possible_values:
          type: array
          items:
            $ref: "#/components/schemas/CustomFields.CustomFieldPossibleValue"
          description: Possible values (list fields)
        trackers:
          type: array
          items:
            $ref: "#/components/schemas/Reference"
          description: Trackers the custom field is enabled for (issue custom fields)
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Reference"
          description: |-
            Roles the custom field is visible to (issue custom fields, since Redmine 7.0 also time entry, project and version
            custom fields)
      description: Custom field definition
    CustomFields.CustomFieldPossibleValue:
      type: object
      required:
        - value
        - label
      properties:
        value:
          type: string
          description: Value
        label:
          type: string
          description: Label
      description: Possible value of a list custom field
    CustomFields.DTOs.CustomFieldsDto:
      type: object
      required:
        - custom_fields
      properties:
        custom_fields:
          type: array
          items:
            $ref: "#/components/schemas/CustomFields.CustomField"
    Enumerations.DTOs.DocumentCategoriesDto:
