  /attachments/{id}.json:
    get:
      operationId: Attachments_getAttachment
      description: Get a single attachment. The file can be downloaded at its `content_url`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
