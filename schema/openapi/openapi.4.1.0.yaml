        - $ref: "#/components/parameters/Issues.Queries.GetIssuesQuery.fixed_version_id"
        - $ref: "#/components/parameters/Issues.Queries.GetIssuesQuery.parent_id"
        - $ref: "#/components/parameters/Issues.Queries.GetIssuesQuery.subject"
        - $ref: "#/components/parameters/Issues.Queries.GetIssuesQuery.created_on"
        - $ref: "#/components/parameters/Issues.Queries.GetIssuesQuery.updated_on"
        - $ref: "#/components/parameters/Issues.Queries.GetIssuesQuery.closed_on"
        - $ref: "#/components/parameters/Issues.Queries.GetIssuesQuery.start_date"
        - $ref: "#/components/parameters/Issues.Queries.GetIssuesQuery.due_date"
        - $ref: "#/components/parameters/Issues.Queries.GetIssuesQuery.query_id"
        - $ref: "#/components/parameters/Issues.Queries.GetIssuesQuery.sort"
        - $ref: "#/components/parameters/Pagination.offset"
        - $ref: "#/components/parameters/Pagination.limit"
      responses:
