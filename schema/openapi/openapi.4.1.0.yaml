  - name: Custom Fields
  - name: Enumerations
  - name: Files
  - name: Groups
  - name: Memberships
  - name: Issue Categories
  - name: Issue Relations
  - name: Issue Statuses
  - name: Issues
  - name: My Account
  - name: Users
